name: Sync Upstream Mihon Sources

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
    inputs:
      id:
        description: "Optional single extension ID to sync (e.g. en.comix)"
        required: false
        type: string
        default: ""
      force:
        description: "Force AI port even if no new Mihon diff (requires id)"
        required: false
        type: boolean
        default: false
      model:
        description: "Optional Gemini model override (e.g. gemini-3.1-pro-preview)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "Check for upstream updates without modifying files"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.99.0"
          targets: wasm32-unknown-unknown

      - name: Cache rust stuff
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            sources/**/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: ./.github/actions/install-aidoku-cli

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Sync upstream Mihon & Aidoku changes
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ inputs.model || vars.GEMINI_MODEL }}
          INPUT_ID: ${{ inputs.id }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [[ -n "$INPUT_ID" ]]; then
            args+=(--id "$INPUT_ID")
          fi
          if [[ "$INPUT_FORCE" == "true" ]]; then
            args+=(--force)
          fi
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          node scripts/sync-upstream.mjs "${args[@]}"

      - name: Detect source or registry changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain -- 'sources/*/src' 'sources/*/res' 'sources/*/assets' 'sources/*/Cargo.toml')" ]]; then
            echo "sources_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "sources_changed=false" >> "$GITHUB_OUTPUT"
          fi
          if [[ -n "$(git status --porcelain -- sources/ extensions.json)" ]]; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build sources
        if: steps.changes.outputs.sources_changed == 'true'
        run: |
          set -euo pipefail

          for source in sources/*; do
            [[ -f "$source/Cargo.toml" ]] || continue

            echo "::group::Packaging $source"
            (
              cd "$source"
              aidoku package
            )
            echo "::endgroup::"
          done

      - name: Build & verify source list
        if: steps.changes.outputs.sources_changed == 'true'
        run: |
          rm -f public/sources/*.aix public/icons/*.png
          aidoku build sources/*/package.aix --name "Mlyn Aidoku Sources"
          touch public/.nojekyll
          node scripts/build-repo.mjs
          node scripts/build-repo.mjs --verify

      - name: Deploy to GitHub Pages
        if: steps.changes.outputs.sources_changed == 'true'
        uses: JamesIves/github-pages-deploy-action@v4.7.2
        with:
          branch: gh-pages
          folder: public
          git-config-name: GitHub Actions
          git-config-email: github-actions[bot]@users.noreply.github.com
          commit-message: Update source list from upstream sync
          single-commit: true

      - name: Commit & push synced sources to main
        if: steps.changes.outputs.any_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/ extensions.json public/
          if ! git diff --cached --quiet; then
            git commit -m "Sync upstream Mihon/Aidoku updates [skip ci]"
            git pull --rebase origin main || true
            git push origin HEAD:main
          fi
